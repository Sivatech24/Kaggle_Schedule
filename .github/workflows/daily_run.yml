name: Trigger Kaggle Notebook Daily

on:
  schedule:
    - cron: '30 2 * * *'   # Runs daily at 02:30 UTC (08:00 IST)
  workflow_dispatch:

jobs:
  run-kaggle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Kaggle API
        run: |
          python -m pip install --upgrade pip
          pip install kaggle

      - name: Write Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          printf '{"username":"%s","key":"%s"}\n' "${KAGGLE_USERNAME}" "${KAGGLE_KEY}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Show kernel folder (for debug)
        run: |
          echo "Listing kaggle_kernel:"
          ls -la ./kaggle_kernel || true
          echo "kernel-metadata.json contents:"
          cat ./kaggle_kernel/kernel-metadata.json || true

      - name: Push kernel (create new version) and show output
        run: |
          set -x
          KERNEL_DIR=./kaggle_kernel
          if [ ! -d "$KERNEL_DIR" ]; then
            echo "Kernel directory $KERNEL_DIR not found. Create it and add kernel-metadata.json + your .ipynb"
            exit 1
          fi
          kaggle kernels push -p "$KERNEL_DIR"