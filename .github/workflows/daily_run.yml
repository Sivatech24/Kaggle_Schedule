name: Trigger Kaggle Notebook Daily

on:
  schedule:
    - cron: '30 2 * * *'   # Runs daily at 02:30 UTC (08:00 IST)
  workflow_dispatch:       # Allows manual trigger

jobs:
  run-kaggle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Kaggle API
        run: |
          python -m pip install --upgrade pip
          pip install kaggle

      - name: Write Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          cat > ~/.kaggle/kaggle.json <<EOF
          {"username":"${KAGGLE_USERNAME}","key":"${KAGGLE_KEY}"}
          EOF
          chmod 600 ~/.kaggle/kaggle.json

      - name: Show kernel folder (for debug)
        run: ls -la ./kaggle_kernel || true

      - name: Push kernel (create new version)
        # Ensure your kernel files (kernel-metadata.json + .ipynb) live in ./kaggle_kernel
        run: |
          KERNEL_DIR=./kaggle_kernel
          if [ ! -d "$KERNEL_DIR" ]; then
            echo "Kernel directory $KERNEL_DIR not found. Create it and add kernel-metadata.json + your .ipynb"
            exit 1
          fi
          kaggle kernels push -p "$KERNEL_DIR" --quiet